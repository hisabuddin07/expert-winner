<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            color: #00d4ff;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time {
            color: #ffffff;
            font-size: 2em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .date {
            color: #b0e0e6;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
        }

        .control-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .add-timezone {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            background: white;
        }

        .info {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .time {
                font-size: 1.5em;
            }

            .control-section {
                flex-direction: column;
            }

            button, select {
                width: 100%;
            }
        }

        .empty-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Global Digital Clock</h1>
        
        <div class="clocks-grid" id="clocks-container">
            <!-- Clocks will be generated here -->
        </div>

        <div class="add-timezone">
            <select id="timezone-select">
                <option value="">Select a timezone to add...</option>
            </select>
            <button onclick="addTimezone()">Add Timezone</button>
        </div>

        <div class="control-section">
            <button onclick="resetToDefault()">Reset to Default</button>
            <button onclick="clearAllClocks()">Clear All</button>
        </div>

        <div class="info">
            💡 Click "Add Timezone" to add more clocks or "Reset" to go back to defaults
        </div>
    </div>

    <script>
        // Default timezones to display
        const defaultTimezones = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'New Delhi', tz: 'Asia/Kolkata' }
        ];

        // All available timezones
        const allTimezones = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'Los Angeles', tz: 'America/Los_Angeles' },
            { name: 'Chicago', tz: 'America/Chicago' },
            { name: 'Denver', tz: 'America/Denver' },
            { name: 'Toronto', tz: 'America/Toronto' },
            { name: 'Mexico City', tz: 'America/Mexico_City' },
            { name: 'São Paulo', tz: 'America/Sao_Paulo' },
            { name: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Paris', tz: 'Europe/Paris' },
            { name: 'Berlin', tz: 'Europe/Berlin' },
            { name: 'Madrid', tz: 'Europe/Madrid' },
            { name: 'Istanbul', tz: 'Europe/Istanbul' },
            { name: 'Moscow', tz: 'Europe/Moscow' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'New Delhi', tz: 'Asia/Kolkata' },
            { name: 'Bangkok', tz: 'Asia/Bangkok' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'Hong Kong', tz: 'Asia/Hong_Kong' },
            { name: 'Shanghai', tz: 'Asia/Shanghai' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Seoul', tz: 'Asia/Seoul' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Melbourne', tz: 'Australia/Melbourne' },
            { name: 'Auckland', tz: 'Pacific/Auckland' },
            { name: 'Fiji', tz: 'Pacific/Fiji' }
        ];

        let currentTimezones = [...defaultTimezones];

        // Initialize on page load
        function init() {
            populateTimezoneSelect();
            updateClocks();
            setInterval(updateClocks, 1000);
        }

        // Populate the timezone select dropdown
        function populateTimezoneSelect() {
            const select = document.getElementById('timezone-select');
            select.innerHTML = '<option value="">Select a timezone to add...</option>';
            
            allTimezones.forEach(tz => {
                const isAlreadyAdded = currentTimezones.some(t => t.tz === tz.tz);
                if (!isAlreadyAdded) {
                    const option = document.createElement('option');
                    option.value = tz.tz;
                    option.textContent = tz.name;
                    select.appendChild(option);
                }
            });
        }

        // Add a new timezone
        function addTimezone() {
            const select = document.getElementById('timezone-select');
            const tzValue = select.value;

            if (!tzValue) return;

            const timezone = allTimezones.find(t => t.tz === tzValue);
            if (timezone) {
                currentTimezones.push(timezone);
                populateTimezoneSelect();
                updateClocks();
            }
        }

        // Remove a timezone
        function removeTimezone(tz) {
            currentTimezones = currentTimezones.filter(t => t.tz !== tz);
            populateTimezoneSelect();
            updateClocks();
        }

        // Reset to default timezones
        function resetToDefault() {
            currentTimezones = [...defaultTimezones];
            populateTimezoneSelect();
            updateClocks();
        }

        // Clear all clocks
        function clearAllClocks() {
            currentTimezones = [];
            populateTimezoneSelect();
            updateClocks();
        }

        // Update all clocks
        function updateClocks() {
            const container = document.getElementById('clocks-container');
            
            if (currentTimezones.length === 0) {
                container.innerHTML = '<div class="empty-message">No timezones selected. Add one to get started!</div>';
                return;
            }

            container.innerHTML = '';

            currentTimezones.forEach(timezone => {
                const time = getTimeInTimezone(timezone.tz);
                const clockEl = document.createElement('div');
                clockEl.className = 'clock';
                clockEl.innerHTML = `
                    <div class="timezone-name">${timezone.name}</div>
                    <div class="time">${time.time}</div>
                    <div class="date">${time.date}</div>
                    <button onclick="removeTimezone('${timezone.tz}')" style="margin-top: 10px; padding: 8px 15px; font-size: 0.85em;">Remove</button>
                `;
                container.appendChild(clockEl);
            });
        }

        // Get time in a specific timezone
        function getTimeInTimezone(tz) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz,
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            const time = formatter.format(now);
            const date = dateFormatter.format(now);

            return { time, date };
        }

        // Start the app
        init();
    </script>
</body>
</html>
